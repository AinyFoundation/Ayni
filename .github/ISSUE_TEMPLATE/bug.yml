name: Bug
description: Something is broken
title: '[bug] '
labels: [bug]
assignees: []

body:
  - type: textarea
    id: what
    attributes:
      label: What's broken
      description: Brief description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS / runtime / version or commit"
