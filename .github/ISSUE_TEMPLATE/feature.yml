name: Feature
description: Propose a new feature or improvement
title: '[feature] '
labels: [enhancement]
assignees: []

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is it worth doing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why is this one better?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, prior art, anything else that helps reviewers understand.
