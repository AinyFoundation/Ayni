<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Placeholder portrait. A generic silhouette, deliberately not a face:
       a stock photograph beside a placeholder name would read as a real guest,
       which is the same deception the quotes themselves are guarded against.
       Replace with a consented photo when the quote beside it becomes real.

       Hex mirrors the design tokens "color-clay-t" (ground) and "color-clay"
       (figure), spelled without their custom-property dashes because an XML
       comment may not contain a double hyphen. An SVG loaded through an img
       tag is its own document and cannot read the page's custom properties,
       so the values have to be restated here. -->
  <title>Placeholder portrait</title>
  <clipPath id="frame"><circle cx="48" cy="48" r="48" /></clipPath>
  <g clip-path="url(#frame)">
    <rect width="96" height="96" fill="#EAD4C1" />
    <circle cx="48" cy="37" r="18" fill="#C36A54" />
    <path d="M48 52a46 46 0 0 1 46 46H2a46 46 0 0 1 46-46Z" fill="#C36A54" />
  </g>
</svg>
