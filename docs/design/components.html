    /* ── Components page-specific overrides ── */
    .section--center { text-align: center; }
    .section--center .logo-img { height: 480px; margin: 0 0 -130px; }
    .section--center h1 { margin: 0; font-family: 'Noto Serif' !important; font-weight: 300; }

    /* ── Prototype 01: infinite-scroll rainbow strip ── */
    .proto-rainbow {
      width: 100%;
      overflow: hidden;            /* clip the overflowing track */
      position: relative;
    }
    .proto-rainbow .track {
      display: flex;
      width: max-content;
      animation: rainbow-scroll 30s linear infinite;
      align-items: stretch;
    }
    .proto-rainbow .row {
      display: flex;
      flex: 0 0 auto;
      height: 160px;               /* strip thickness — visible from across the room */
      width: 200vw;                /* each row = 2 viewports wide; track = 4 vw total */
    }
    .proto-rainbow .band {
      flex: 1 1 0;
      min-width: 0;                /* let flex shrink children properly */
    }
    .proto-rainbow .band:nth-child(1) { background: linear-gradient(to right, var(--plum)   0%, var(--clay)   100%); }
    .proto-rainbow .band:nth-child(2) { background: linear-gradient(to right, var(--clay)   0%, var(--amber)  100%); }
    .proto-rainbow .band:nth-child(3) { background: linear-gradient(to right, var(--amber)  0%, var(--gold)   100%); }
    .proto-rainbow .band:nth-child(4) { background: linear-gradient(to right, var(--gold)   0%, var(--sage)   100%); }
    .proto-rainbow .band:nth-child(5) { background: linear-gradient(to right, var(--sage)   0%, var(--slate)  100%); }
    .proto-rainbow .band:nth-child(6) { background: linear-gradient(to right, var(--slate)  0%, var(--indigo) 100%); }
    .proto-rainbow .band:nth-child(7) { background: linear-gradient(to right, var(--indigo) 0%, var(--plum)   100%); }

    @keyframes rainbow-scroll {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }   /* shift by one row = seamless loop */
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-rainbow .track { animation: none; transform: translate3d(0,0,0); }
    }
  </style>
</head>
